services:
  web:
    build: .
    image: llm-document-qa
    env_file: .env
    environment:
      # Always run the container in production mode, whatever .env says.
      DJANGO_DEBUG: "0"
      DATA_DIR: /app/data
    ports:
      - "8000:8000"
    volumes:
      # SQLite database + uploaded files survive container rebuilds.
      - app-data:/app/data
    restart: unless-stopped

volumes:
  app-data:
